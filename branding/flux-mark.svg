<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Flux">
  <!-- The Flux mark.
       A current, not a cursor: the product's whole claim is that work moves
       through it while you are elsewhere. Lime because it has to survive
       being the only saturated thing on a screen that is otherwise black,
       white and grey - a duller accent would read as a disabled state.
       The bolt is deliberately heavy: it has to hold at 16px in a tab strip,
       where a thin mark turns to mush. -->
  <rect width="64" height="64" rx="15" fill="#b4f03c"/>
  <path d="M37 8 L17 36 H28 L25 56 L47 27 H35 Z" fill="#14200a"/>
</svg>
