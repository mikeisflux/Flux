<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #b4f03c; }
    a:hover { color: #cbf571; }
    /* Lifted verbatim from src/resources/app.css - these are the product's
       real tokens, not an approximation of them. */
    .root {
      --bg: #1b1b1a;
      --fg: #f2f2f0;
      --fg-muted: #9a9a96;
      --border: #34343150;
      --hover: #262624;
      --invert-bg: #f2f2f0;
      --invert-fg: #111;
      --accent-fg: #14200a;
      --radius-card: 12px;
      --radius-nav: 8px;
      font: 15px/1.5 system-ui, sans-serif;
    }
    .root[data-theme="light"] {
      --bg: #fff;
      --fg: #1a1a1a;
      --fg-muted: #6b6b68;
      --border: #e8e8e6;
      --hover: #f1f1f0;
      --invert-bg: #111;
      --invert-fg: #fff;
    }
    .root * { box-sizing: border-box; }
  </style>
</helmet>
<div class="root" data-theme="{{theme}}" style="--accent: {{accent}}; width: 1120px; height: 780px; padding: 34px 40px 64px; background: var(--bg); color: var(--fg); overflow: hidden"><div style="display: flex; max-width: 720px; min-height: 100%; flex-direction: column; justify-content: center; margin: 0 auto"><div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 30px"><svg viewBox="0 0 64 64" style="width: 40px; height: 40px; display: block" role="img" aria-label="Flux"><rect width="64" height="64" rx="15" fill="{{accent}}"></rect><path d="M37 8 L17 36 H28 L25 56 L47 27 H35 Z" fill="var(--accent-fg)"></path></svg><span style="font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Flux</span></div><div style="display: flex; justify-content: center; gap: 7px; margin-bottom: 34px"><span style="width: 22px; height: 7px; border-radius: 999px; background: var(--accent)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--border)"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--border)"></span></div><h1 style="margin: 0 0 30px; font-size: 40px; font-weight: 400; letter-spacing: -0.01em; text-align: center">First, a model key</h1><p style="max-width: 760px; margin: 0 auto 24px; color: var(--fg-muted); font-size: 14px; text-align: center">Flux runs on Claude or GPT and calls the provider directly with your key. Nothing routes through us, and the key is stored encrypted by the browser, never sent to the page.</p><div style="display: flex; gap: 10px; margin-top: 8px"><select style="padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit"><option>Anthropic</option><option>OpenAI</option></select><input type="password" placeholder="Paste an API key" style="flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--fg); font: inherit"></div><div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 34px"><button style="border: 0; background: transparent; color: var(--fg-muted); font: inherit; font-size: 13px; cursor: pointer">Skip for now</button><button style="padding: 10px 18px; border: 0; border-radius: var(--radius-nav); background: var(--accent); color: var(--accent-fg); font: inherit; font-size: 14px; cursor: pointer">Save and continue</button></div></div></div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#b4f03c","options":["#b4f03c","#7bd1ff","#ff9f4a","#e8705f"]},"$preview":{"width":1120,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'dark',
      accent: this.props.accent ?? '#b4f03c',
    };
  }
}
</script>
</body>
</html>
