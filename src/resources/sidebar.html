<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flux</title>
  <link rel="icon" href="flux-mark.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body class="shell">
  <!-- The titlebar band. The sidebar column runs the full height of the
       window, so the top 44px of it is the part of the titlebar to the left of
       the tab strip. The two buttons sit at its trailing edge, against the
       first tab. -->
  <div class="shell-titlebar">
    <button class="ghost-icon" id="search" title="Search" aria-label="Search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
    </button>
    <button class="ghost-icon" id="collapse" title="Hide sidebar"
            aria-label="Hide sidebar">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M8 3.5v13"/></svg>
    </button>
  </div>

  <nav class="sidebar" aria-label="Main">
    <a class="nav-item" href="index.html#new-task" target="_blank"
       data-view="new-task" aria-current="page">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15.5V17h1.5l9-9L12 6.5l-9 9zM16.7 5.3a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0L12.4 3.6 15.4 6.6l1.3-1.3z"/></svg>
      New task
    </a>
    <a class="nav-item" href="index.html#templates" target="_blank"
       data-view="templates">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3V3zm8 0h6v6h-6V3zM3 11h6v6H3v-6zm8 0h6v6h-6v-6z"/></svg>
      Templates
    </a>
    <a class="nav-item" href="index.html#workflows" target="_blank"
       data-view="workflows">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7h9V4l4 4-4 4V9H6v2H4V7zm12 6H7v3l-4-4 4-4v2h11v3h-2z"/></svg>
      Workflows
    </a>
    <a class="nav-item" href="index.html#connectors" target="_blank"
       data-view="connectors">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 12a3 3 0 0 1 0-4l2-2a3 3 0 0 1 4 4l-1 1M12 8a3 3 0 0 1 0 4l-2 2a3 3 0 0 1-4-4l1-1"/></svg>
      Connectors
    </a>
    <a class="nav-item" href="index.html#customize" target="_blank"
       data-view="customize">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l7 4v8l-7 4-7-4V6l7-4zm0 2.3L5 7v6l5 2.7L15 13V7l-5-2.7z"/></svg>
      Customize
    </a>

    <!-- Not in the reference product: a running task there is invisible unless
         you navigate to it, and a task blocked on approval is invisible
         entirely. Both are surfaced here permanently, and the sidebar is the
         only surface that is always on screen to surface them on. -->
    <div class="nav-section">
      <div class="nav-label">Runs <span id="concurrency" class="muted"></span></div>
      <div id="run-list" class="run-list"></div>
    </div>

    <a class="nav-item approvals" href="index.html#approvals" target="_blank"
       data-view="approvals" id="approvals-nav" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l8 14H2L10 2zm0 5v4m0 2v1"/></svg>
      Approvals
      <span class="badge" id="approvals-badge">0</span>
    </a>
  </nav>

  <script type="module" src="sidebar.js"></script>
</body>
</html>
