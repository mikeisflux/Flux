<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flux</title>
  <link rel="icon" href="flux-mark.svg">
  <link rel="stylesheet" href="app.css">
</head>
<!-- No nav here: the console's five-item nav is browser chrome now, served to
     FluxSidebarView from sidebar.html on this same host. This document is only
     ever the content column, so it fills whatever the shell gives it. -->
<body class="tab">
  <main class="content" id="content"></main>

  <dialog class="approval" id="approval-dialog" aria-labelledby="approval-title">
    <h2 id="approval-title">Approve this action?</h2>
    <p class="approval-effect" id="approval-effect"></p>
    <p class="approval-rationale" id="approval-rationale"></p>
    <pre class="approval-payload" id="approval-payload" hidden></pre>
    <label class="approval-note">
      Note back to the agent (optional)
      <input type="text" id="approval-note" autocomplete="off">
    </label>
    <div class="approval-actions">
      <button class="ghost" id="approval-deny">Don't do it</button>
      <button class="primary" id="approval-allow">Approve</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
