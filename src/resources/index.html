<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flux</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <nav class="sidebar" aria-label="Main">
    <button class="nav-item" data-view="new-task" aria-current="page">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15.5V17h1.5l9-9L12 6.5l-9 9zM16.7 5.3a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0L12.4 3.6 15.4 6.6l1.3-1.3z"/></svg>
      New task
    </button>
    <button class="nav-item" data-view="templates">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3V3zm8 0h6v6h-6V3zM3 11h6v6H3v-6zm8 0h6v6h-6v-6z"/></svg>
      Templates
    </button>
    <button class="nav-item" data-view="workflows">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7h9V4l4 4-4 4V9H6v2H4V7zm12 6H7v3l-4-4 4-4v2h11v3h-2z"/></svg>
      Workflows
    </button>
    <button class="nav-item" data-view="connectors">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 12a3 3 0 0 1 0-4l2-2a3 3 0 0 1 4 4l-1 1M12 8a3 3 0 0 1 0 4l-2 2a3 3 0 0 1-4-4l1-1"/></svg>
      Connectors
    </button>
    <button class="nav-item" data-view="customize">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l7 4v8l-7 4-7-4V6l7-4zm0 2.3L5 7v6l5 2.7L15 13V7l-5-2.7z"/></svg>
      Customize
    </button>

    <!-- Not in the reference product: a running task there is invisible unless
         you navigate to it, and a task blocked on approval is invisible
         entirely. Both are surfaced here permanently. -->
    <div class="nav-section">
      <div class="nav-label">Runs <span id="concurrency" class="muted"></span></div>
      <div id="run-list" class="run-list"></div>
    </div>

    <button class="nav-item approvals" data-view="approvals" id="approvals-nav" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2l8 14H2L10 2zm0 5v4m0 2v1"/></svg>
      Approvals
      <span class="badge" id="approvals-badge">0</span>
    </button>
  </nav>

  <main class="content" id="content"></main>

  <dialog class="approval" id="approval-dialog" aria-labelledby="approval-title">
    <h2 id="approval-title">Approve this action?</h2>
    <p class="approval-effect" id="approval-effect"></p>
    <p class="approval-rationale" id="approval-rationale"></p>
    <pre class="approval-payload" id="approval-payload" hidden></pre>
    <label class="approval-note">
      Note back to the agent (optional)
      <input type="text" id="approval-note" autocomplete="off">
    </label>
    <div class="approval-actions">
      <button class="ghost" id="approval-deny">Don't do it</button>
      <button class="primary" id="approval-allow">Approve</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
